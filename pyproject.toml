[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbisprobe"
version = "0.3.0.dev0"
description = "Evidence-driven PS4/Orbis security research harness"
requires-python = ">=3.11"
dependencies = ["capstone==5.0.9"]

[project.optional-dependencies]
angr = ["angr==9.2.184", "pycparser==2.22"]

[tool.setuptools.package-data]
"orbisprobe.backends" = ["ghidra_scripts/*.java"]

[tool.setuptools.packages.find]
include = ["orbisprobe*"]
exclude = ["tests*", "evidence*", "docs*", "examples*", "scripts*"]

[project.scripts]
orbisprobe = "orbisprobe.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
