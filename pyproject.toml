[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbisprobe"
version = "0.2.0.dev1"
description = "Evidence-driven PS4/Orbis security research harness"
requires-python = ">=3.11"
dependencies = ["capstone==5.0.9"]

[project.scripts]
orbisprobe = "orbisprobe.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
